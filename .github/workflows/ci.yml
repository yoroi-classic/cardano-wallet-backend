name: ci

# Baseline gate for every branch in the flow. Lint, format, types, build,
# unit/contract tests with coverage, production dependency audit, and Docker build.
# This is the check required on development and up, including Dependabot PRs.
on:
  push:
    branches: [development, preview, preprod, main]
  pull_request:
    branches: [development, preview, preprod, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Unit and contract tests with coverage
        run: npm run test:coverage
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Docker build check
        run: npm run docker:build
      - name: Docker runtime health check
        timeout-minutes: 5
        run: npm run docker:smoke

      # `npm audit` only ever sees our own dependency tree. It knows nothing about the base image,
      # which is most of what actually ships: the Debian packages, and the npm that Node bundles.
      # When this was first run against the image, it found seven fixable HIGH/CRITICAL advisories
      # that every other gate here was blind to, two of them CRITICAL.
      #
      # --ignore-unfixed is the load-bearing flag. A Debian slim image always carries a tail of
      # advisories with no fix published anywhere, and failing on those would be a gate nobody can
      # pass, which is a gate somebody eventually deletes. This fails only on what we can actually
      # do something about, which makes a red build a real instruction rather than a nuisance.
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cardano-wallet-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
