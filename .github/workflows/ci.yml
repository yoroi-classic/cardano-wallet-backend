name: ci

# Baseline gate for every branch in the flow. Lint, format, types, build,
# unit/contract tests with coverage, production dependency audit, and Docker build.
# This is the check required on development and up, including Dependabot PRs.
on:
  push:
    branches: [development, preview, preprod, main]
  pull_request:
    branches: [development, preview, preprod, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix e2e
      - name: E2E harness safety tests
        run: npm test --prefix e2e
      - name: E2E harness typecheck
        run: npm run typecheck --prefix e2e
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # Run the base commit's checker for pull requests so a branch cannot weaken the release
      # workflow and its verifier in the same change. The fallback is needed only while the
      # checker is first introduced; after this PR lands, every target branch has the trusted copy.
      - name: Check release gate contract
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git cat-file -e "$TRUSTED_BASE_SHA:scripts/check-release-gate.mjs" 2>/dev/null; then
              git show "$TRUSTED_BASE_SHA:scripts/check-release-gate.mjs" \
                > "$RUNNER_TEMP/check-release-gate.mjs"
              node "$RUNNER_TEMP/check-release-gate.mjs"
            else
              echo "base commit has no release checker yet, running the PR copy this once"
              npm run check:release-gate
            fi
          else
            npm run check:release-gate
          fi
      - name: Unit and contract tests with coverage
        run: npm run test:coverage
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Docker build check
        run: npm run docker:build
      - name: Docker runtime health check
        timeout-minutes: 5
        run: npm run docker:smoke

      # `npm audit` only ever sees our own dependency tree. It knows nothing about the base image,
      # which is most of what actually ships: the Debian packages, and the npm that Node bundles.
      # When this was first run against the image, it found seven fixable HIGH/CRITICAL advisories
      # that every other gate here was blind to, two of them CRITICAL.
      #
      # --ignore-unfixed is the load-bearing flag. A Debian slim image always carries a tail of
      # advisories with no fix published anywhere, and failing on those would be a gate nobody can
      # pass, which is a gate somebody eventually deletes. This fails only on what we can actually
      # do something about, which makes a red build a real instruction rather than a nuisance.
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cardano-wallet-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
