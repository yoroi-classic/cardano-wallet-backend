name: helm-chart

on:
  push:
    branches: [development, preview, preprod, main]
    paths:
      - 'charts/**'
      - '.github/workflows/helm-chart.yml'
  pull_request:
    branches: [development, preview, preprod, main]
    paths:
      - 'charts/**'
      - '.github/workflows/helm-chart.yml'

permissions:
  contents: read

jobs:
  cardano-wallet-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 3.21.3
      - name: Set up Kubernetes API
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0
          kubectl_version: v1.35.0

      - name: Lint chart
        run: helm lint charts/cardano-wallet-backend

      - name: Package chart
        run: helm package charts/cardano-wallet-backend --destination "${RUNNER_TEMP}"

      - name: Check chart version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-chart-version-bump.mjs

      - name: Validate default chart
        run: helm template cardano-wallet-backend charts/cardano-wallet-backend | kubectl apply --dry-run=server -f -

      - name: Validate ingress chart
        run: |
          helm template cardano-wallet-backend charts/cardano-wallet-backend \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=cardano-wallet-backend.example.com' \
          | kubectl apply --dry-run=server -f -

      - name: Validate secret-backed chart
        run: |
          helm template cardano-wallet-backend charts/cardano-wallet-backend \
            --set secrets.existingSecret=cardano-wallet-backend-secrets \
          | kubectl apply --dry-run=server -f -

      - name: Validate remote config override
        run: |
          helm template cardano-wallet-backend charts/cardano-wallet-backend \
            --set config.remoteConfig.url=https://raw.githubusercontent.com/yoroi-classic/yoroi-config/0000000000000000000000000000000000000000/prod.json \
          | kubectl apply --dry-run=server -f -

      - name: Validate defensive string overrides
        run: |
          helm template cardano-wallet-backend charts/cardano-wallet-backend \
            --set nameOverride=123 \
            --set serviceAccount.name=123 \
            --set ingress.enabled=true \
            --set ingress.className=123 \
            --set 'ingress.tls[0].hosts[0]=cardano-wallet-backend.example.com' \
            --set 'ingress.tls[0].secretName=123' \
            --set 'podLabels.app\.kubernetes\.io/name=ignored' \
            --set 'podLabels.app\.kubernetes\.io/instance=ignored' \
          | kubectl apply --dry-run=server -f -

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: cardano-wallet-backend
    runs-on: ubuntu-latest
    concurrency:
      group: helm-chart-publish-main
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 3.21.3

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Decide whether to publish
        id: chart
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          chart=charts/cardano-wallet-backend
          package_output="$(helm package "$chart" --destination "${RUNNER_TEMP}")"
          package_path="${package_output##*: }"
          archive="$(basename "$package_path")"
          version="${archive#cardano-wallet-backend-}"
          version="${version%.tgz}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"

          BASE_REF="$BEFORE" node scripts/check-chart-version-bump.mjs

          chart_ref="oci://ghcr.io/yoroi-classic/charts/cardano-wallet-backend"
          probe_output="${RUNNER_TEMP}/ghcr-chart-probe.txt"
          if helm show chart "$chart_ref" --version "$version" >"$probe_output" 2>&1; then
            published=true
          elif grep -Fq "${chart_ref#oci://}:$version: not found" "$probe_output"; then
            published=false
          else
            echo "::error::Unable to determine whether chart version $version exists in GHCR"
            cat "$probe_output"
            exit 1
          fi

          if [ "$published" = true ]; then
            if ! git diff --quiet "$BEFORE" HEAD -- "$chart"; then
              echo "::error::Chart version $version already exists in GHCR; bump Chart.yaml before changing chart content"
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish OCI chart
        if: steps.chart.outputs.publish == 'true'
        env:
          PACKAGE_PATH: ${{ steps.chart.outputs.package_path }}
        run: |
          helm push "$PACKAGE_PATH" oci://ghcr.io/yoroi-classic/charts
