name: publish-image

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [development, preview, preprod, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["development","preview","preprod","main"]'), github.ref_name))
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image-${{ github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Require successful CI for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch "$SOURCE_BRANCH" --commit "$SOURCE_SHA" --event push \
            --status success --json databaseId --jq length)
          test "$runs" -gt 0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check whether this revision is published
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$SOURCE_SHA"
          echo "ref=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" > "$RUNNER_TEMP/image-probe" 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif grep -Eq 'not found|manifest unknown' "$RUNNER_TEMP/image-probe"; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/image-probe" >&2
            exit 1
          fi
      - name: Publish tested revision
        id: build
        if: steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image reference
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Image: %s\n\nDigest: %s\n' "$IMAGE_REF" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
