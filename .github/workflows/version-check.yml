name: version-check

# From preview onward, every PR must carry a semver bump over its base branch.
# Development is intentionally exempt so day-to-day work stays fast.
on:
  pull_request:
    branches: [preview, preprod, main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Ensure the base branch is available
        run: git fetch origin ${{ github.base_ref }} --depth=1
      # Run the base branch's copy of the checker, not the PR's, so a PR can't weaken
      # the gate by editing the checker in the same change. Fall back to the PR copy
      # only when the base doesn't have it yet (first time the script is introduced).
      - name: Check version bump
        run: |
          base="origin/${{ github.base_ref }}"
          if git cat-file -e "$base:scripts/check-version-bump.mjs" 2>/dev/null \
            && git cat-file -e "$base:scripts/version-utils.mjs" 2>/dev/null; then
            git show "$base:scripts/check-version-bump.mjs" > "$RUNNER_TEMP/check-version-bump.mjs"
            git show "$base:scripts/version-utils.mjs" > "$RUNNER_TEMP/version-utils.mjs"
            node "$RUNNER_TEMP/check-version-bump.mjs"
          else
            echo "base branch has no shared checker yet, running the PR copy this once"
            node scripts/check-version-bump.mjs
          fi
        env:
          BASE_REF: origin/${{ github.base_ref }}
      - name: Check Helm chart version bump
        run: |
          base="origin/${{ github.base_ref }}"
          if git cat-file -e "$base:scripts/check-chart-version-bump.mjs" 2>/dev/null \
            && git cat-file -e "$base:scripts/version-utils.mjs" 2>/dev/null; then
            git show "$base:scripts/check-chart-version-bump.mjs" > "$RUNNER_TEMP/check-chart-version-bump.mjs"
            git show "$base:scripts/version-utils.mjs" > "$RUNNER_TEMP/version-utils.mjs"
            node "$RUNNER_TEMP/check-chart-version-bump.mjs"
          else
            echo "base branch has no shared chart checker yet, running the PR copy this once"
            node scripts/check-chart-version-bump.mjs
          fi
        env:
          BASE_REF: origin/${{ github.base_ref }}
