name: version-check

# From preview onward, every PR must carry a semver bump over its base branch.
# Development is intentionally exempt so day-to-day work stays fast.
on:
  pull_request:
    branches: [preview, preprod, main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Ensure the base branch is available
        run: git fetch origin ${{ github.base_ref }} --depth=1
      # Run the base branch's copy of the checker, not the PR's, so a PR can't weaken
      # the gate by editing the checker in the same change. Fall back to the PR copy
      # only when the base doesn't have it yet (first time the script is introduced).
      - name: Check version bump
        run: |
          base="origin/${{ github.base_ref }}"
          if git cat-file -e "$base:scripts/check-version-bump.mjs" 2>/dev/null; then
            git show "$base:scripts/check-version-bump.mjs" > "$RUNNER_TEMP/check-version-bump.mjs"
            node "$RUNNER_TEMP/check-version-bump.mjs"
          else
            echo "base branch has no checker yet, running the PR copy this once"
            node scripts/check-version-bump.mjs
          fi
        env:
          BASE_REF: origin/${{ github.base_ref }}
